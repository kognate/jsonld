name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: GHC ${{ matrix.ghc }} / cabal ${{ matrix.cabal }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.6", "9.8.2", "9.10.1"]
        cabal: ["3.12.1.0"]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GHC ${{ matrix.ghc }}
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Configure
        run: |
          cabal update
          cabal configure --enable-tests --disable-optimisation

      - name: Generate freeze file (for cache key)
        run: cabal freeze

      - name: Cache ~/.cabal/store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ matrix.ghc }}-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test --test-show-details=direct
